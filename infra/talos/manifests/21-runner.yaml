apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-data
  namespace: ci
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: ci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      serviceAccountName: ci-runner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: docker.io/gitea/runner:2.0.1-dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000/
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-registration
                  key: token
            - name: GITEA_RUNNER_NAME
              value: talos-dind-runner
            - name: GITEA_RUNNER_LABELS
              value: talos-host:host
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "6"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-runner-data
